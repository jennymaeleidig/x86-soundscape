<div class="w-fit h-fit grid justify-items-center hover:invert">
  <div cdkDragHandle>
    <button
      class="cursor-pointer"
      [title]="feature.appearance().tooltip ?? null"
      (dblclick)="activate()"
      (touchend)="activate()"
      (mousedown)="setMoving()"
      (mouseup)="unsetMoving()"
    >
      <img [src]="feature.appearance().icon" />
    </button>
  </div>
  <div class="mt-1 bg-white">{{ feature.title }}</div>
</div>
