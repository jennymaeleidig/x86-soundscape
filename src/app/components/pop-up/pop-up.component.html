<div class="absolute min-w-screen min-h-screen" (click)="onClose.emit()">
  <div
    (click)="$event.stopPropagation()"
    class="fixed top-0 right-0 left-0 z-50 justify-center content-center m-auto h-[calc(100%-1rem)] md:max-w-1/4 md:max-h-full"
  >
    <div class="modal-dialog outer-border">
      <div class="inner-border center">
        <div class="modal-contents">
          <h1 class="modal-text text-center">{{ title }}</h1>
          <br />
          <ng-container *ngComponentOutlet="content" />
          <br />
          <section class="field-row justify-end gap-2">
            <button class="btn" (click)="onClose.emit()">OK</button>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
