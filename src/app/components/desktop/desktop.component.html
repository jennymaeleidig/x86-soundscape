<!-- navbar -->
<app-menu></app-menu>
<div #bounds class="relative w-full h-full overflow-hidden desktop-bounds">
  <winamp></winamp>
  <!-- Selectable area -->
  <!-- The selectable area does not play nice w/ the drag library, only ever marks as selected at initial location. -->
  <dts-select-container
    class="w-full h-full absolute top-0 left-0 overflow-hidden"
    #container="dts-select-container"
    [(selectedItems)]="selectedApplets"
    [disabled]="appletIsMoving"
  >
    <div
      dir="rtl"
      class="flex flex-col flex-wrap gap-6 max-h-full absolute top-5 right-5 items-center"
    >
      @for (applet of applets; track applet) {
        <div
          [dtsSelectItem]="applet"
          [class.selected]="isSelected(applet)"
          [style.transform]="
            applet.x !== 0 || applet.y !== 0
              ? 'translate3d(' + applet.x + 'px, ' + applet.y + 'px, 0)'
              : 'none'
          "
        >
          <div
            cdkDragBoundary=".desktop-bounds"
            cdkDrag
            (cdkDragStarted)="onDragStarted(applet)"
            (cdkDragMoved)="onDragMoved($event, applet)"
            (cdkDragEnded)="onDragEnded($event, applet)"
          >
            <app-applet [feature]="applet.feature"></app-applet>
          </div>
        </div>
      }
    </div>
  </dts-select-container>
</div>
