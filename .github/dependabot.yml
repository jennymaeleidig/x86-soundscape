---
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: npm
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/*"
          - "angular-eslint"
          - "typescript-eslint"
        update-types:
          - minor
          - patch
      test-tooling:
        patterns:
          - "vitest"
          - "jsdom"
        update-types:
          - minor
          - patch
      lint-format:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-config-prettier"
          - "prettier"
          - "husky"
        update-types:
          - minor
          - patch
      styles:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"
          - "@sakun/system.css"
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
